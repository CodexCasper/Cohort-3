<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex elements in DOM</title>
</head>
<body>
    <input type="text" placeholder="Add Your To Do Here"></input>
    <Button onclick="createComplexDomElement()"> Add To Do !</Button>

    <script>
        function createComplexDomElement(){
            const value = document.querySelector("input").value;//fetching the data inside "input" and fetching its value
            const spanEl = document.createElement("span");//creating and storing a span tag 
            const buttonEl = document.createElement("button");//creating and storing a button element 

            spanEl.innerHTML =  value;// updating the value of input in span
            buttonEl.innerHTML = "Delete";//updating the value of button but here it is fixed

            const divEl = document.createElement("div");//here first we created two elements "span,button" then put inside an div tag and then div tag is putted inside body
            divEl.appendChild(spanEl);// before we just created the span and button tags but here we are actually putting them in DOM
            divEl.appendChild(buttonEl);

           // divEl.innerHTML = "<div>" + value + "</div><button> Delete </button>";

            document.querySelector("body").appendChild(divEl);// and in the last we are appending our whole div tag in body.

        }
    </script>
</body>
</html>
