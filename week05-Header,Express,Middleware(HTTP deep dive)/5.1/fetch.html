<!--CREATING a background request , means sending a HTTP request to a server > does not refresh the page > contunes running js > handles the responses when it arrives using browser provided function 'fetch' -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch example</title>
    <!-- fetch is an http client , sending request to server -->
</head>
<body>
    Linkedin
    <div id="posts"></div>
    <script>
        async function fetchPost(){
        
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1",{
            method: "GET"
        })
        // to store the response we store it in variable 
        //since we are fetching but it is no necessary that it will give response in very less time that is why we use await function 
        // JSONplaceholder , is a random website which returns a random posts 

        //converting this data into json
        const data = await response.json();
        console.log(data);

        //how to put this 'data' inside body , by using DOM
        document.getElementByID("posts").innerHTML = data.body // body we can see in the fetch , this is how we can put data anything inside fetch inside our website 

        }

        fetchPost();
    </script>
</body>
</html>
