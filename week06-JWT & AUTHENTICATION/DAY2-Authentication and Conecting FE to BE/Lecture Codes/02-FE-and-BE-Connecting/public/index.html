<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTHENTICATION WEBSITE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <script>
        async function signup(){// function should be asynchronous bcoz we are fetching data from backend and it can take time
            const username = document.querySelector("#signup-username").value;
            const password = document.querySelector("#signup-password").value;

            ///fetch the api
             const response = await axios.post("http://localhost:3000/signup", {
                username: username,
                password: password
            })
            alert("you are signed up");
        }
    
        async function signin(){
        const username = document.getElementById("signin-username").value;
        const password = document.getElementById("signin-password").value;

        // this will have the token hat the backend will return me 
        const response = await axios.post("http://localhost:3000/signin", {
                username: username,
                password: password
            })
             //unlike postmen, we need to store our token somewhere 

             localStorage.setItem("token",response.data.token)
             alert("you are signed in");
        }
    
        //this fn we write bcoz when user will sign in he should not see the sign and signup endpoints
        async function getUserInformation(){
            const response = await axios.get("http://localhost:3000/me",{ // sending a backend request to headers 
                headers: {
                    token: localStorage.getItem("token")
                }
            })  
            document.getElementById("Information").innerHTML = "username: " + response.data.username + " password" + response.data.password; 
        }
        getUserInformation(); 

         function logout() {                 //aur jaise logout pe click krenge logout button pe toh yeh call ho jyega 
            localStorage.removeItem("token");           //aur localstorage ko empty kr dega jisse token hatt jyega jo uspe pehle store kr rhe the ..aur if there is no token then no username and password will be there present in it. 
            document.getElementById("information").innerHTML = "You have been logged out.";         //aur yeh udhr uske innerHTML mein store hokr udhr show kr dega 
        }
    </script>
</head>
<body>
    <div>
        SIGNUP
        <input id="signup-username" type="text" placeholder="username"></input>
        <input id="signup-password" type="password" placeholder="password"></input>
        <button onclick="signup()">Submit</button>
    </div>
    <div>
        SIGNIN
        <input id="signin-username" type="text" placeholder="username"></input>
        <input id="signin-password" type="password" placeholder="password"></input>
        <button onclick="signin()">Submit</button>
    </div>
    <div>
        USER INFORMATION:
        <br>
        <div id="Information"></div>
        <button onclick="logout()">Logout</button>
    </div>
</body>
</html>
