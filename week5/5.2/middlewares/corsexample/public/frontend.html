<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
    <script>
        function sendrequest(){
            axios.post("http://localhost:3000/sum",{// here we are posting values of a and b by taking input
                a : document.getElementById("1").value,// we know that we ccan fetch the value by using DOM 
                b : document.getElemenById("2").value
            }) 
        }
    </script>
</head>
<body>
    <div id="posts"></div>

    <input id="1" type="text" placeholder="Enter first number"></input>
    <input id="2" type="text" placeholder="Enter second number"></input>
    <button onclick="sendrequest">Find sum</button>

</body>
</html>
